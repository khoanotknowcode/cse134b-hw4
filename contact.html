<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Khoa</title>
    <script>
        // Early load theme to prevent flash reload
        try {
            const theme = localStorage.getItem('theme');
            if (theme) {
                document.documentElement.setAttribute('data-theme', theme);
            }
        } catch (error) {}

        // Skip intro animation after first view in this tab
        try {
            if (sessionStorage.getItem('introSeen')) {
                document.documentElement.classList.add('skip-intro');
            } else {
                sessionStorage.setItem('introSeen', '1');
            }
        } catch (error) {}
    </script>
    <link rel="icon" href="images/logo.png">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/contact.css">
    <link rel="stylesheet" href="styles/theme-switch.css">
    <script src="scripts/theme.js" defer></script>
    <!-- Hide theme toggle when JS is off -->
    <noscript>
        <style>
            li:has(> #theme) { 
                display: none; 
            }
        </style>
    </noscript>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="experience.html">Experiences</a></li>
                <li><a href="project.html">Projects</a></li>
                <li><a href="contact.html"><strong>Contact Me</strong></a></li>
                <li><a href="form-no-js.html">Form</a></li>
                <li><a href="form-with-js.html">JS Form</a></li>
                <li><button id="theme" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" 
                    width="1rem" height="1rem" viewBox="0 0 24 24" 
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" 
                    class="lucide lucide-sun preview-icon" id="sun">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2"/>
                        <path d="M12 20v2"/>
                        <path d="m4.93 4.93 1.41 1.41"/>
                        <path d="m17.66 17.66 1.41 1.41"/>
                        <path d="M2 12h2"/><path d="M20 12h2"/>
                        <path d="m6.34 17.66-1.41 1.41"/>
                        <path d="m19.07 4.93-1.41 1.41"/>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" 
                        width="1rem" height="1rem" viewBox="0 0 24 24" 
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" 
                        class="lucide lucide-moon preview-icon" id="moon">
                        <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/>
                    </svg>
                </button></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="swap">
            <h1>Interested to talk?</h1>

            <section>
                <h2>Contact Me</h2>

                <form action="#" method="post">
                    <section class="name-input">
                        <label for="name">Name</label>
                        <input type="text" name="name" id="name" maxlength="50" required/>
                    </section>
                    
                    <section class="email-input">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" maxlength="254" required/>
                    </section>
                    
                    <section class="message-input">
                        <label for="message">Message</label>
                        <textarea 
                            name="message" 
                            id="message" 
                            rows="5" 
                            cols="30" 
                            placeholder="Let me know about you..." 
                            maxlength="250"
                            required></textarea><br>
                    </section>
                    
                    <section class="submit-button">
                        <input type="submit" value="Contact">
                    </section>
                </form>

                <section id="socials">
                    <a href="#">@email</a>
                    <a href="#">@instagram</a>
                    <a href="#">@linkedin</a>
                </section>
            </section>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Khoa Le</p>
    </footer>
</body>
</html>
