<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khoa's Website</title>
    <script>
        // Early load theme to prevent flash reload
        try {
            const theme = localStorage.getItem('theme');
            if (theme) {
                document.documentElement.setAttribute('data-theme', theme);
            }
        } catch (error) {}

        // Skip intro animation after first view in this tab
        try {
            const introKey = 'introSeen:' + location.pathname;
            if (sessionStorage.getItem(introKey)) {
                document.documentElement.classList.add('skip-intro');
            } else {
                sessionStorage.setItem(introKey, '1');
            }
        } catch (error) {}
    </script>
    <link rel="icon" href="images/logo.png">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/home.css">
    <link rel="stylesheet" href="styles/theme-switch.css">
    <script src="scripts/theme.js" defer></script>
    <!-- Hide theme toggle when JS is off -->
    <noscript>
        <style>
            li:has(> #theme) { 
                display: none; 
            }
        </style>
    </noscript>
</head>
